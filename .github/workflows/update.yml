# Every day: scrape the galleries and commit the data if it changed.
# Vercel then rebuilds and deploys the app from that push.
name: Update exhibitions

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 in Seoul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape galleries
        run: node scrapers/build.mjs

      - name: Commit data if changed
        run: |
          # Vercel's Hobby plan only deploys commits authored by the account owner,
          # so the data commit uses the owner's identity rather than github-actions[bot].
          git config user.name "Ant-sai"
          git config user.email "antoine.saintlouis@gmail.com"
          git add app/public/exhibitions.json
          # generatedAt changes on every run: only commit when the exhibitions themselves changed.
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vq '"generatedAt"'; then
            git commit -m "Update exhibitions data"
            git push
          else
            echo "No exhibition changes"
          fi
